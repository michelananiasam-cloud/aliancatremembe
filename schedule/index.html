<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Programação Movimento Tremembé</title>
<link rel="icon" href="https://misericordia.com.br/wp-content/uploads/2019/11/16x16px.png" type="image/x-icon">

<style>

/* ===============================
   STATUS DAS ATIVIDADES
================================*/
/* ❌ ENCERRADO (hoje + anteriores) */
.item.encerrado {
  border-left: 5px solid rgba(40,167,69,0.7);
  background: rgba(40,167,69,0.06);
  opacity: 1;
}

/* 🟡 FUTURO */
.item.futuro {
  border-left: 5px solid transparent;
  background: transparent;
  opacity: 1;
}

/* 🔵 EM ANDAMENTO */
.item.em-andamento {
  border-left: 5px solid #2d6cdf;
  background: rgba(45,108,223,0.06);
}

.item.em-andamento.ativo {
  border-left: 5px solid rgba(45,108,223,0.7);
  background: rgba(45,108,223,0.05);
}

.item.em-andamento.warning {
  border-left: 5px solid rgba(255,193,7,0.8);
  background: rgba(255,193,7,0.06);
}

.item.em-andamento.danger {
  border-left: 5px solid rgba(220,53,69,0.8);
  background: rgba(220,53,69,0.06);
}

/* 🌟 PRÓXIMA ATIVIDADE */
.item.proxima {
  border-left: 5px solid rgba(60,60,60,0.4);
  background: rgba(0,0,0,0.04);
  box-shadow: 0 0 12px rgba(255,193,7,0.35);
  transform: scale(1.01);
}

/* ⚠️ alertas continuam opcionais */
.item.warning {
  border-left: 5px solid #ffc107;  
}

.item.danger {
  border-left: 5px solid #dc3545;
}
	
@keyframes piscar-warning {
  0%   { background: rgba(255,193,7,0.25); }
  50%  { background: rgba(255,193,7,0.05); }
  100% { background: rgba(255,193,7,0.25); }
}

@keyframes piscar-danger {
  0%   { background: rgba(220,53,69,0.35); }
  50%  { background: rgba(220,53,69,0.1); }
  100% { background: rgba(220,53,69,0.35); }
}
	
/* ===============================
   BARRA DE PROGRESSO
================================*/

.progress-container{
  width: 100%;
  height: 6px;
  margin-top: 6px;
  background: rgba(0,0,0,.08);
  border-radius: 999px;
  overflow: hidden;
  flex-shrink: 0;
}

.progress-bar {
  height: 100%;
  transition: width 0.3s linear;
}

.progress-bar.futuro {
  background: #ffc107;
}

.progress-bar.ativo{
  background: linear-gradient(90deg, #2d6cdf, #5a8dff);
}

.progress-bar.warning{
  background: linear-gradient(90deg, #ffc107, #ffd95e);
}

.progress-bar.danger{
  background: linear-gradient(90deg, #dc3545, #ff6b7a);
}

/* ===============================
   BOTÃO VOLTAR
================================*/
.btn-voltar {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.5rem 1rem;
  background: #f5f5f7;
  color: #111;
  border: 1px solid rgba(0,0,0,0.15);
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.95rem;
  font-weight: 600;
  text-decoration: none;
  transition: all 0.2s ease;
  margin-bottom: 1.5rem;
}

.btn-voltar:hover {
  background: #2d6cdf;
  color: #fff;
  border-color: #2d6cdf;
}

@media (prefers-color-scheme: dark) {
  .btn-voltar {
    background: #141416;
    color: #f1f1f1;
    border-color: rgba(255,255,255,0.15);
  }
  .btn-voltar:hover {
    background: #5a8dff;
    color: #fff;
  }
}

/* ===============================
   VARIÁVEIS E TEMA
================================*/
:root{
  --watermark-display: flex;	
  --bg:#ffffff;
  --text:#111;
  --muted:#666;
  --card:#f5f5f7;
  --brand:#2d6cdf;
  --warn:#ffc107;
  --danger:#dc3545;
  --radius:10px;
  --space-1:0.25rem;
  --space-2:0.5rem;
  --space-3:0.75rem;
  --space-4:1rem;
  --space-5:1.25rem;
  --space-6:1.5rem;
  --space-8:2rem;
  --font-base:16px;
}

@media (prefers-color-scheme: dark){
  :root{
	--bg:#0b0b0c;
	--text:#f1f1f1;
	--muted:#aaa;
	--card:#141416;
	--brand:#5a8dff;
  }
}

/* ===============================
   RESET E BASE
================================*/
*{ box-sizing:border-box; }
html, body { min-height: 100%; height: auto; }
body {
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  font-size: var(--font-base);
  line-height:1.45;
  color:var(--text);
  background:var(--bg);
  margin:0;
  padding: var(--space-6) var(--space-4) var(--space-8);
}

h1,h2,h3{
  margin:0 0 var(--space-4);
  line-height:1.2;
}
h1{ font-size:1.6rem; font-weight:700; }
h2{ font-size:1.25rem; font-weight:600; }
h3{ font-size:1.1rem; color:var(--muted); font-weight:600; }

.container{
  max-width: 1100px;
  margin: 0 auto;
}

/* ===============================
   CABEÇALHO DA WEB
================================*/
#web-header{
  display:flex;
  gap: var(--space-4);
  align-items:center;
  justify-content:center;
  padding: var(--space-4) var(--space-4);
  position: relative;
  top:0;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid color-mix(in srgb, var(--text) 10%, transparent);
  z-index: 5;
}

#web-header img{
  width: 120px;
  height:auto;
}

#web-header h1{
  text-align:center;
  margin:0;
}

/* ===============================
   FORMULÁRIO SUPERIOR – CAMPOS BASE
================================*/
.field{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.field label{
  font-weight:600;
  font-size:0.92rem;
}

input, select{
  width:100%;
  padding: 0.7rem 0.8rem;
  border:1px solid color-mix(in srgb, var(--text) 18%, transparent);
  background: var(--bg);
  color: var(--text);
  border-radius:8px;
  font-size:1rem;
}

input[type="time"]{
  font-variant-numeric: tabular-nums;
}

/* Botão principal */
button.add{
  padding: 0.95rem 1.1rem;
  background: var(--brand);
  color: #fff;
  font-weight:600;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-size:1rem;
  width:100%;
}
@media (min-width:820px){
  button.add{ width:auto; }
}

/* Demais botões */
button.open,
button.clone,
button.delete,
button.edit{
  padding: 0.55rem 0.8rem;
  font-size:0.9rem;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

button.open, button.clone{
  background: var(--brand);
  color:#fff;
}
button.delete{
  background: var(--danger);
  color:#fff;
}
button.edit{
  background: var(--warn);
  color:#000;
}

/* ===============================
   PATCH: SUPORTE às classes col-*
================================*/
#menu-adicao{
  display:grid;
  grid-template-columns: repeat(12, 1fr);
  gap:16px;
  padding: var(--space-6) var(--space-4);
  margin: var(--space-6) auto;
  background: var(--card);
  border-radius: var(--radius);
  border: 1px solid color-mix(in srgb, var(--text) 10%, transparent);
  position: sticky;
  top: 0;
  z-index: 20;
  background: color-mix(in srgb, var(--card) 80%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid color-mix(in srgb, var(--text) 12%, transparent);
}

#menu-adicao .col-2,
#menu-adicao .col-3,
#menu-adicao .col-4,
#menu-adicao .col-6,
#menu-adicao .col-8,
#menu-adicao .col-12 {
  grid-column: span 12;
}

@media (min-width:560px){
  #menu-adicao .col-2{ grid-column: span 6; }
  #menu-adicao .col-3{ grid-column: span 6; }
  #menu-adicao .col-4{ grid-column: span 6; }
  #menu-adicao .col-6{ grid-column: span 6; }
  #menu-adicao .col-8{ grid-column: span 12; }
  #menu-adicao .col-12{ grid-column: span 12; }
}

@media (min-width:900px){
  #menu-adicao .col-2{ grid-column: span 2; }
  #menu-adicao .col-3{ grid-column: span 3; }
  #menu-adicao .col-4{ grid-column: span 4; }
  #menu-adicao .col-6{ grid-column: span 6; }
  #menu-adicao .col-8{ grid-column: span 8; }
  #menu-adicao .col-12{ grid-column: span 12; }
}

/* ===============================
   LISTA DE ATIVIDADES
================================*/
#scroll-spacer{
  height: 120px;
  pointer-events: none;
}

#lista{
  display:block;
  margin-top: var(--space-6);
}

.pagina-detalhe{
  margin-bottom: var(--space-8);
}

.lista-atividades{
  list-style:none;
  margin:0;
  padding:0;
  border:1px solid color-mix(in srgb, var(--text) 12%, transparent);
  border-radius:var(--radius);
  background:var(--bg);
  overflow:hidden;
}

.lista-atividades li{
  flex-direction: column;
  display:flex;
  flex-wrap:wrap;
  align-items:flex-start;
  justify-content:space-between;
  gap: var(--space-3);
  padding: var(--space-4) var(--space-5);
  border-bottom:1px solid color-mix(in srgb, var(--text) 8%, transparent);
  position: relative;
}

.lista-atividades li:last-child{
  border-bottom:none;
}

.item-info{
  text-align:left;
  flex:1 1 auto;
  font-size:1rem;
  line-height:1.35;
  word-break:break-word;
}

.item-botoes{
  display:flex;
  flex-wrap:wrap;
  gap: var(--space-3);
}

.icon-obs {
  position: absolute;
  top: 6px;
  right: 6px;
  font-size: 18px;
  cursor: pointer;
  opacity: 0.6;
  transition: all 0.2s ease;
}

.icon-obs:hover {
  opacity: 1;
  transform: scale(1.2);
}

.icon-obs.tem-obs {
  opacity: 1;
}

@media(max-width:520px){
  .item-info{ order:1; }
  .progress-container{ order:999; width:100%; }
  .item-botoes{ order:3; }
}

@media (min-width:521px){
  .item-botoes{
    opacity: 0;
    visibility: hidden;
    transform: translateX(10px);
    transition: all .2s ease;
  }
  .lista-atividades li:hover .item-botoes{
    opacity: 1;
    visibility: visible;
    transform: translateX(0);
  }
}

/* ===============================
   PRINT (IMPRIMIR)
================================*/
.print-only{ display:none; }
.logo { display: none; }

@media print {
  .item.destaque {
    border-left: none !important;
    background: transparent !important;
  }
	
  .item {
    border-left: none !important;
    position: static !important;
  }

  .print-only {
    display: block !important;
  }

  /* REMOVE ELEMENTOS DA INTERFACE */
  #menu-adicao,
  #web-header,
  #menu-rodape,
  .item-botoes,
  button,
  .add,
  .open,
  .edit,
  .delete,
  .clone,
  .btn-voltar,
  .progress-container,
  .watermark,
  .icon-obs,
  #btn-pdf-mobile,
  #btn-atualizar-mobile {
    display: none !important;
  }

  /* BASE DA IMPRESSÃO */
  html, body {
    background: #fff !important;
    color: #000 !important;
    margin: 0 !important;
    padding: 0 !important;
    font-size: 14px !important;
  }

  /* PÁGINAS */
  .pagina-detalhe {
    display: block !important;
    page-break-before: always;
    page-break-inside: avoid;
    position: relative !important;
    padding-top: 100px !important;
  }
  
  .pagina-detalhe:first-child {
    page-break-before: auto;
  }

  /* LOGO NA IMPRESSÃO */
  .logo {
    display: block !important;
  }

  .pagina-detalhe .logo {
    display: block !important;
    position: absolute !important;
    top: 0 !important;
    left: 0 !important;
    width: 100px !important;
    height: auto !important;
    z-index: 10 !important;
  }

  /* TÍTULO */
  .pagina-detalhe h2 {
    position: absolute !important;
    top: 20px !important;
    left: 0 !important;
    right: 0 !important;
    text-align: center !important;
    font-size: 18px !important;
    font-weight: 700 !important;
    margin: 0 !important;
  }

  /* DATA / DIA DA SEMANA */
  .pagina-detalhe h3 {
    margin-top: 10px !important;
    margin-bottom: 10px !important;
    font-size: 15px !important;
  }

  /* LISTA */
  .lista-atividades {
    border: none !important;
    background: #fff !important;
  }

  .lista-atividades li {
    display: block !important;
    border: none !important;
    padding: 4px 0 !important;
    margin-bottom: 4px !important;
  }

  .item-info {
    display: block !important;
    white-space: normal !important;
  }

  * {
    background: transparent !important;
    box-shadow: none !important;
    animation: none !important;
  }
}

/* ===============================
   MENU DE RODAPÉ
================================*/
#menu-rodape{
  position: fixed;
  inset: auto 0 0 0;
  background: color-mix(in srgb, var(--card) 80%, transparent);
  border-top: 1px solid color-mix(in srgb, var(--text) 15%, transparent);
  padding: 4px 8px calc(4px + env(safe-area-inset-bottom));
  box-shadow: 0 -2px 6px rgba(0,0,0,0.08);
  z-index: 1000;
  -webkit-overflow-scrolling: touch;
  contain: layout paint;
}

.menu-rodape-content{
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  max-width: 1100px;
  margin: 0 auto;
  min-width: 0;
}

.field-inline{
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  flex: 0 1 auto;
}

#menu-rodape label{
  font-size: 0.9rem;
  font-weight: 600;
  white-space: nowrap;
}

#menu-rodape input{
  padding: 6px 10px;
  font-size: 0.9rem;
  border-radius: 8px;
  border: 1px solid color-mix(in srgb, var(--text) 18%, transparent);
  background: var(--bg);
  color: var(--text);
  min-width: 140px;
  max-width: 220px;
  width: 100%;
}

.rodape-actions{
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 1 1 auto;
  justify-content: flex-end;
  min-width: 0;
  flex-wrap: nowrap;
}

.btn_rodape,
.sec-btn{
  padding: 8px 12px;
  font-size: 0.9rem;
  border-radius: 8px;
  cursor: pointer;
  white-space: nowrap;
  border: 1px solid color-mix(in srgb, var(--text) 18%, transparent);
  background: color-mix(in srgb, var(--card) 92%, transparent);
  color: var(--text);
}

.sec-btn{
  background: var(--danger);
  color:#fff;
}

.btn_rodape{
  background: var(--brand);
  color:#fff;
}

@media (max-width: 720px){
  .menu-rodape-content{
    flex-wrap: wrap;
    gap: 8px;
  }
  .field-inline{
    flex: 1 1 100%;
  }
  .rodape-actions{
    flex: 1 1 100%;
    justify-content: flex-start;
    flex-wrap: wrap;
    gap: 6px;
  }
  #menu-rodape input{
    max-width: 100%;
  }
}

button.obs {
  background: transparent;
  border: none;
  cursor: pointer;
  font-size: 20px;
  opacity: 0.6;
  transition: all 0.2s ease;
}

button.obs:hover {
  opacity: 1;
  transform: scale(1.3);
}

button.obs.tem-obs {
  color: #2d6cdf;
  opacity: 1;
}

body{
  padding-bottom: 200px !important;
}

#menu-adicao {
  position: relative;
}

#toggle-menu-adicao {
  position: absolute;
  top: 8px;
  right: 8px;
  z-index: 30;
}

#menu-adicao.collapsed {
  height: 22px !important;
  max-height: 48px !important;
  overflow: hidden !important;
  padding-top: 12px !important;
}

#menu-adicao.collapsed > *:not(#toggle-menu-adicao) {
  opacity: 0 !important;
  visibility: hidden !important;
  height: 0 !important;
  overflow: hidden !important;
  margin: 0 !important;
  padding: 0 !important;
  pointer-events: none !important;
}

#menu-adicao.collapsed #toggle-menu-adicao {
  opacity: 1 !important;
  visibility: visible !important;
  pointer-events: auto !important;
}

.watermark {
  display: var(--watermark-display);
  position: fixed;
  inset: 0;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  user-select: none;
  z-index: 999999;
  font-size: 60px;
  font-weight: bold;
  color: rgba(0,0,0,0.06);
  transform: rotate(-30deg);
}

@media print { .watermark { display:none!important; } }

.item.destaque {
  background: rgba(255,193,7,0.08); 
  border-left: 5px solid #ffc107;
  position: relative;
}

@media (max-width:520px){
  .lista-atividades:empty { display: none; }
  .item-botoes { display: none !important; }
  .pagina-detalhe:has(.lista-atividades:empty) { display: none; }
  .item.encerrado { display: none !important; }
  .item.futuro:not(.proxima) { display: none !important; }
  #menu-rodape{ display: none !important; }
  #menu-adicao{ display: none !important; }
  #toggle-menu-adicao{ display: none !important; }
}

</style>
</head>
<body>
<div class="container">

  <div id="web-header" role="banner" aria-label="Topo">
    <a href="../" class="logo-link">
      <img src="https://misericordia.com.br/wp-content/uploads/2023/08/alianca_logo-header.png" alt="Logo da Aliança">
    </a>
    <h1 id="titulo-web">Programação Movimento Tremembé</h1>
  </div>

  <div id="menu-adicao" aria-labelledby="titulo-form">
    <button id="toggle-menu-adicao" class="toggle-form-btn">-</button>
    <h2 id="titulo-form" class="sr-only" style="position:absolute;left:-9999px;">Adicionar atividade</h2>

    <div class="field col-2">
      <label for="data">Data</label>
      <input type="date" id="data" title="Selecione a data da atividade">
    </div>
	
    <div class="field col-4">
      <label for="tipo">Tipo</label>
      <select id="tipo" title="Escolha o tipo da atividade">
        <option value="" disabled selected>Selecione o Tipo..</option>
        <option value="Chegada">Chegada</option>
        <option value="Introdução">Introdução</option>
        <option value="Institucional">Institucional</option>  
        <option value="Pregação">Pregação</option>
        <option value="Oração">Oração</option>
        <option value="Acolhida">Acolhida</option>
        <option value="Animação">Animação</option>
        <option value="Adoração">Adoração</option>
        <option value="Dinâmica">Dinâmica</option>
        <option value="Testemunho">Testemunho</option>
        <option value="Santa Missa">Santa Missa</option>
        <option value="Momento">Momento</option>
        <option value="Historinha">Historinha</option>
        <option value="Monólogo">Monólogo</option>
        <option value="Efusão">Efusão</option>
        <option value="Teatro">Teatro</option>
        <option value="Pausa">Pausa</option>
        <option value="Intervalo">Intervalo</option>
        <option value="Almoço">Almoço</option>
        <option value="Café">Café</option>
        <option value="Jantar">Jantar</option>
        <option value="Palestra">Palestra</option>
        <option value="Partilha">Partilha</option>
        <option value="Encerramento">Encerramento</option> 
      </select>
    </div>
   
    <div class="field col-4">
      <label for="nome">Nome da Atividade</label>
      <input type="text" id="nome" placeholder="Nome da Atividade" title="Digite o nome da atividade">
    </div>
   
    <div class="field col-6">
      <label for="servo">Servo</label>
      <input type="text" id="servo" placeholder="Nome do Servo" title="Digite o nome do Servo">
    </div>
   
    <div class="field col-2">
      <label for="inicio">Hora Início</label>
      <input type="time" id="inicio" title="Selecione a hora de início da atividade">
    </div>
   
    <div class="field col-2">
      <label for="fim">Hora Fim</label>
      <input type="time" id="fim" title="Selecione a hora de término da atividade">
    </div>
   
    <div class="field col-12" style="align-items:flex-start;">
      <button class="add" onclick="adicionarAtividade()" aria-label="Adicionar Atividade">
        Adicionar Atividade
      </button>
    </div>
  </div>

  <div id="lista" aria-live="polite"></div>

  <div id="menu-rodape" role="region" aria-label="Alterar evangelização (rodapé)">
    <form class="menu-rodape-content" onsubmit="alterarEvangelizacao(event)">
      <div class="field-inline">
        <label for="evangelizacao">Evangelização</label>
        <input type="text" id="evangelizacao" placeholder="Nome da Evangelização" title="Digite o nome da Evangelização">
      </div>

      <div class="rodape-actions">
        <button type="submit" class="btn_rodape brand">Alterar Evangelização</button>
        <button id="btn-zerar-tudo" type="button" class="sec-btn danger" onclick="zerarTudo()">Excluir</button>
        <button type="button" class="btn_rodape" onclick="exportarBackup()">Export</button>
        <button type="button" class="btn_rodape" onclick="document.getElementById('importar-arquivo').click()">ImportLocal</button>
        <button type="button" class="btn_rodape" onclick="window.print()">PDF</button>
        <button type="button" class="btn_rodape" onclick="renderizarLista()">Atualizar</button>
          
        <input type="file" id="importar-arquivo" accept=".json,application/json,*/*" style="display:none" onchange="handleImportFile(this.files[0])" />
      </div>
    </form>
  </div>

  <button id="btn-pdf-mobile" type="button" onclick="window.print()">📄 PDF</button>
  <button id="btn-atualizar-mobile" type="button" onclick="renderizarLista()">🔄 Atualizar</button>
	
  <div id="scroll-spacer"></div>
</div>

<script>
let atividadeAtual = null;	
let isPrinting = false;
const LIST_KEY  = "Programação";
const EVANG_KEY = "evangelizacao";
const EVANG_DEFAULT = "Movimento Tremembé";

function diaDaSemanaPorData(dataString) {
  const diasSemana = ["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
  const dataObj = new Date(dataString + "T00:00:00"); 
  return diasSemana[dataObj.getDay()];
}

function getEvangelizacao() {
  try {
    const v = localStorage.getItem(EVANG_KEY);
    return (v || "").trim() || EVANG_DEFAULT;
  } catch {
    return EVANG_DEFAULT;
  }
}

function setEvangelizacao(valor) {
  try {
    localStorage.setItem(EVANG_KEY, (valor || "").trim());
  } catch(e) {
    console.error("Erro salvando evangelização", e);
  }
}

function getTituloProgramacao() {
  return `Programação ${getEvangelizacao()}`;
}

function atualizarTitulos() {
  const h1 = document.getElementById("titulo-web");
  if (h1) h1.textContent = getTituloProgramacao();
  document.title = getTituloProgramacao();
}

function alterarEvangelizacao(e) {
  e?.preventDefault();
  const input = document.getElementById("evangelizacao");
  const novoValor = input.value.trim();
  setEvangelizacao(novoValor);
  atualizarTitulos();
  renderizarLista();
}

function dois(n){ return n.toString().padStart(2,'0'); }

function parseDateTime(data, hora) {
  if (!data || !hora) return null;
  return new Date(`${data}T${hora}:00`);
}

function getStatusAtividade(data, inicio, fim) {
  const inicioDate = parseDateTime(data, inicio);
  const fimDate = parseDateTime(data, fim);

  if (!inicioDate || !fimDate) return "futuro";

  const agora = Date.now();
  if (agora >= inicioDate && agora <= fimDate) return "em-andamento";
  if (agora > fimDate) return "encerrado";

  return "futuro";
}

function marcarProximaAtividade(lista) {
  const agora = Date.now();
  let proximaIndex = -1;
  let menorDiff = Infinity;

  lista.forEach((p, i) => {
    const inicio = parseDateTime(p.data, p.inicio);
    if (!inicio) return;

    if (inicio > agora && (inicio - agora) < menorDiff) {
      menorDiff = inicio - agora;
      proximaIndex = i;
    }
  });

  return proximaIndex;
}

function salvarLista(lista){
  try{
    localStorage.setItem(LIST_KEY, JSON.stringify(lista || []));
  }catch(e){
    alert("Não foi possível salvar localmente.");
  }
}

function carregarLista(){
  try {
    const lista = localStorage.getItem(LIST_KEY);
    const dados = lista ? JSON.parse(lista) : [];

    dados.forEach(item => {
      if (item.obs === undefined) item.obs = "";
      if (!item.id) item.id = `id_${Date.now()}_${Math.random()}`;
    });

    return dados;
  } catch(e){
    console.error(e);
    return [];
  }
}

function ordenarLista(lista) {
  return lista.sort((a, b) => {
    const dateA = new Date(`${a.data}T${a.inicio}:00`);
    const dateB = new Date(`${b.data}T${b.inicio}:00`);
    return dateA - dateB;
  });
}

function el(tag, attrs={}, children=[]) {
  const e = document.createElement(tag);

  Object.entries(attrs).forEach(([k,v])=>{
    if (k === "className") e.className = v;
    else if (k.startsWith("on") && typeof v === "function") e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  });

  (Array.isArray(children) ? children : [children]).forEach(c=>{
    if (typeof c === "string") e.appendChild(document.createTextNode(c));
    else if (c) e.appendChild(c);
  });

  return e;
}

function buildInfo(p) {
  let texto = `[${p.inicio} – ${p.fim}]`;
  if (p.tipo) texto += ` ${p.tipo}`;
  if (p.nome?.trim()) texto += `: ${p.nome.trim()}`;
  if (p.servo?.trim()) texto += ` (${p.servo.trim()})`;
  return texto;
}

function adicionarAtividade() {
  const data = document.getElementById("data").value;
  const tipo = document.getElementById("tipo").value;
  const nome = document.getElementById("nome").value;
  const servo = document.getElementById("servo").value;
  const inicio = document.getElementById("inicio").value;
  const fim = document.getElementById("fim").value;

  if (!data || !inicio || !fim) {
    alert("Preencha ao menos Data, Hora Início e Hora Fim!");
    return;
  }

  const nova = { id: `id_${Date.now()}`, data, tipo, nome, servo, inicio, fim, obs: "" };
  const lista = carregarLista();
  lista.push(nova);
  salvarLista(lista);
  renderizarLista();
  
  // Limpar formulário
  document.getElementById("nome").value = "";
  document.getElementById("servo").value = "";
}

function deletarAtividade(id) {
  let lista = carregarLista();
  lista = lista.filter(item => item.id !== id);
  salvarLista(lista);
  renderizarLista();
}

function zerarTudo() {
  if (confirm("Deseja realmente apagar todas as atividades?")) {
    localStorage.removeItem(LIST_KEY);
    renderizarLista();
  }
}

function renderizarLista() {
  atualizarTitulos();
  const listaDiv = document.getElementById("lista");
  listaDiv.innerHTML = "";

  const lista = ordenarLista(carregarLista());
  const proximaIndex = marcarProximaAtividade(lista);

  const grupos = {};
  lista.forEach(p => {
    if (!grupos[p.data]) grupos[p.data] = [];
    grupos[p.data].push(p);
  });

  const datasOrdenadas = Object.keys(grupos).sort();

  datasOrdenadas.forEach(data => {
    const atividadesDoDia = grupos[data];

    const containerDia = el("section", { className: "pagina-detalhe" });

    // ✅ LOGO Adicionada para Impressão
    const imgLogo = el("img", {
      className: "logo print-only",
      src: "https://misericordia.com.br/wp-content/uploads/2023/08/alianca_logo-header.png",
      alt: "Logo Aliança"
    });

    const dataBr = data.split("-").reverse().join("/");
    const diaSemana = diaDaSemanaPorData(data);

    const h2Titulo = el("h2", { className: "print-only" }, getTituloProgramacao());
    const hDia = el("h3", {}, `${diaSemana} - ${dataBr}`);

    containerDia.appendChild(imgLogo);
    containerDia.appendChild(h2Titulo);
    containerDia.appendChild(hDia);

    const ul = el("ul", { className: "lista-atividades" });

    atividadesDoDia.forEach(p => {
      const idxReal = lista.indexOf(p);
      const status = getStatusAtividade(p.data, p.inicio, p.fim);
      const isProxima = (idxReal === proximaIndex);

      const li = el("li", {
        className: `item ${status} ${isProxima ? 'proxima' : ''}`
      });

      const spanInfo = el("span", { className: "item-info" }, buildInfo(p));
      
      const divBotoes = el("div", { className: "item-botoes" }, [
        el("button", { className: "delete", onclick: () => deletarAtividade(p.id) }, "Excluir")
      ]);

      li.appendChild(spanInfo);
      li.appendChild(divBotoes);
      ul.appendChild(li);
    });

    containerDia.appendChild(ul);
    listaDiv.appendChild(containerDia);
  });
}

// Inicializar página
document.addEventListener("DOMContentLoaded", () => {
  renderizarLista();

  // Comportamento do botão colapsar formulário
  const toggleBtn = document.getElementById("toggle-menu-adicao");
  const menuAdicao = document.getElementById("menu-adicao");

  if(toggleBtn && menuAdicao) {
    toggleBtn.addEventListener("click", () => {
      menuAdicao.classList.toggle("collapsed");
      toggleBtn.textContent = menuAdicao.classList.contains("collapsed") ? "+" : "-";
    });
  }
});
</script>
</body>
</html>
