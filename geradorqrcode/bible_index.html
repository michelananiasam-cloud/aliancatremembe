<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Gerador Bíblia JSON</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 30px;
}

input {
    padding: 8px;
    margin: 5px;
}

button {
    padding: 10px;
    cursor: pointer;
}

textarea {
    width: 100%;
    height: 500px;
    margin-top: 20px;
}
</style>

</head>
<body>

<h2>Gerador Bíblia JSON</h2>

<label>Livro:</label>
<input id="livro" value="genesis">

<label>Capítulo:</label>
<input id="capitulo" type="number" value="1">

<label>Versículo Inicial:</label>
<input id="inicio" type="number" value="1">

<label>Versículo Final:</label>
<input id="fim" type="number" value="5">

<button onclick="gerarJson()">
Gerar JSON
</button>

<button onclick="baixarJson()">
Baixar JSON
</button>

<textarea id="resultado"></textarea>

<script>

let jsonGerado = null;

async function gerarJson() {

    const livro =
        document.getElementById("livro").value;

    const capitulo =
        Number(
            document.getElementById("capitulo").value
        );

    const inicio =
        Number(
            document.getElementById("inicio").value
        );

    const fim =
        Number(
            document.getElementById("fim").value
        );

    jsonGerado = {
        livro: "",
        capitulos: {}
    };

    jsonGerado.capitulos[capitulo] = {
        versiculos: {}
    };

    for (
        let versiculo = inicio;
        versiculo <= fim;
        versiculo++
    ) {

        const response = await fetch(
            `https://www.liriocatolico.com.br/biblia_online/api/${livro}/${capitulo}/${versiculo}.json`
        );

        const data = await response.json();

        if (!jsonGerado.livro) {
            jsonGerado.livro = data.livro;
        }

        jsonGerado
            .capitulos[capitulo]
            .versiculos[versiculo] = {

            ave_maria:
                data.texto_ave_maria || "",

            matos_soares:
                data.texto_matos_soares || ""

        };
    }

    document
        .getElementById("resultado")
        .value =
            JSON.stringify(
                jsonGerado,
                null,
                2
            );
}

function baixarJson() {

    if (!jsonGerado) {
        return;
    }

    const blob = new Blob(
        [
            JSON.stringify(
                jsonGerado,
                null,
                2
            )
        ],
        {
            type: "application/json"
        }
    );

    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement("a");

    a.href = url;

    a.download =
        `${jsonGerado.livro}.json`;

    a.click();

    URL.revokeObjectURL(url);
}

</script>

</body>
</html>
